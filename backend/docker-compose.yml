version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: liyah_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liyah_io
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: liyah_funnel_api
    ports:
      - "8080:8080"
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: liyah_io
      SERVER_PORT: 8080
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
