<!DOCTYPE html>
<html>
<head>
<title>Apply - SomaSync AI</title>
</head>

<body style="font-family:Arial; padding:40px; background:#020617; color:white;">

<h1>Apply for Your Package</h1>

<form action="https://formspree.io/f/YOUR_ID" method="POST">

<input type="text" name="name" placeholder="Your Name" required><br><br>
<input type="email" name="email" placeholder="Email" required><br><br>

<select name="package">
  <option>Starter</option>
  <option>Growth</option>
  <option>Super Pack</option>
</select><br><br>

<textarea name="message" placeholder="Tell us what you need"></textarea><br><br>

<button type="submit">Submit</button>

</form>

</body>
</html>
