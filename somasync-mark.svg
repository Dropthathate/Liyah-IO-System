<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SomaSync AI mark</title>
  <desc id="desc">An interlocking S-shaped sync loop in midnight navy and electric cyan with a gold central spark.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00b8b0"/>
      <stop offset="1" stop-color="#00e0d4"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Cyan lower loop -->
  <path d="M112 307c0-31 12-59 34-81l42-42 53 53-40 40c-8 8-12 18-12 30 0 24 20 44 44 44h86v75h-86c-66 0-121-53-121-119Z" fill="url(#teal)"/>
  <!-- Navy upper loop -->
  <path d="M400 205c0 31-12 59-34 81l-42 42-53-53 40-40c8-8 12-18 12-30 0-24-20-44-44-44h-86v-75h86c66 0 121 53 121 119Z" fill="#071d46"/>
  <!-- Interlock bridge -->
  <path d="M164 184 213 135l135 135-49 49-135-135Z" fill="#0b2e63"/>
  <path d="M348 328 299 377 164 242l49-49 135 135Z" fill="#00d2c8" opacity=".92"/>
  <!-- Center spark -->
  <path d="m256 218 10 28 28 10-28 10-10 28-10-28-28-10 28-10 10-28Z" fill="#e4b93f" filter="url(#softGlow)"/>
</svg>
